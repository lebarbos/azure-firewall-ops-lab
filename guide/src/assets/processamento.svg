<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="proc-title proc-desc" viewBox="0 0 980 520">
  <title id="proc-title">Ordem de processamento de regras no Azure Firewall Policy</title>
  <desc id="proc-desc">Fluxo mostra parent policy antes da child policy, depois três passagens por tipo: DNAT, Network e Application. Dentro de cada tipo, Rule Collection Groups e Rule Collections são avaliados por prioridade; o primeiro match termina o processamento. DNAT casado traduz e permite sem passar por Network rules. Sem match, ocorre deny implícito.</desc>
  <defs>
    <marker id="arrow-proc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#004578"/></marker>
    <style>
      .node{fill:#fff;stroke:#0078d4;stroke-width:2}
      .warn{fill:#fff4ce;stroke:#d83b01;stroke-width:2}
      .deny{fill:#fde7e9;stroke:#a4262c;stroke-width:2}
      .ok{fill:#edf7ed;stroke:#107c10;stroke-width:2}
      .txt{font:14px "Segoe UI",Arial,sans-serif;fill:#1b1a19}
      .title{font:700 17px "Segoe UI",Arial,sans-serif;fill:#1b1a19}
      .small{font:12px "Segoe UI",Arial,sans-serif;fill:#323130}
      .flow{fill:none;stroke:#004578;stroke-width:2.5;marker-end:url(#arrow-proc)}
    </style>
  </defs>
  <text x="490" y="32" text-anchor="middle" class="title">Como uma conexão é avaliada</text>

  <rect x="55" y="72" width="190" height="70" rx="12" class="node"/>
  <text x="150" y="101" text-anchor="middle" class="title">Policy pai</text>
  <text x="150" y="124" text-anchor="middle" class="small">herdada primeiro</text>
  <rect x="300" y="72" width="190" height="70" rx="12" class="node"/>
  <text x="395" y="101" text-anchor="middle" class="title">Policy filha</text>
  <text x="395" y="124" text-anchor="middle" class="small">depois da pai</text>
  <path d="M245 107H300" class="flow"/>

  <rect x="555" y="56" width="365" height="102" rx="12" class="warn"/>
  <text x="737" y="88" text-anchor="middle" class="title">Regras herdadas</text>
  <text x="737" y="113" text-anchor="middle" class="small">Pai sempre tem precedência sobre filha</text>
  <text x="737" y="135" text-anchor="middle" class="small">NAT não é herdado; TI mode só fica mais estrito</text>

  <path d="M395 142V192" class="flow"/>

  <rect x="75" y="205" width="230" height="78" rx="12" class="ok"/>
  <text x="190" y="234" text-anchor="middle" class="title">1 · DNAT</text>
  <text x="190" y="257" text-anchor="middle" class="small">match traduz e permite</text>
  <rect x="375" y="205" width="230" height="78" rx="12" class="node"/>
  <text x="490" y="234" text-anchor="middle" class="title">2 · Network</text>
  <text x="490" y="257" text-anchor="middle" class="small">L3/L4 por prioridade</text>
  <rect x="675" y="205" width="230" height="78" rx="12" class="node"/>
  <text x="790" y="234" text-anchor="middle" class="title">3 · Application</text>
  <text x="790" y="257" text-anchor="middle" class="small">HTTP/HTTPS/MSSQL</text>
  <path d="M305 244H375" class="flow"/>
  <path d="M605 244H675" class="flow"/>

  <rect x="112" y="330" width="756" height="70" rx="12" class="node"/>
  <text x="490" y="358" text-anchor="middle" class="title">Dentro de cada tipo</text>
  <text x="490" y="382" text-anchor="middle" class="small">Rule Collection Group por prioridade → Rule Collection por prioridade → primeira regra que casa vence</text>
  <path d="M190 283V330" class="flow"/>
  <path d="M490 283V330" class="flow"/>
  <path d="M790 283V330" class="flow"/>

  <rect x="75" y="435" width="230" height="58" rx="12" class="ok"/>
  <text x="190" y="459" text-anchor="middle" class="title">Match Allow/DNAT</text>
  <text x="190" y="479" text-anchor="middle" class="small">processamento termina</text>
  <rect x="375" y="435" width="230" height="58" rx="12" class="warn"/>
  <text x="490" y="459" text-anchor="middle" class="title">Match Deny</text>
  <text x="490" y="479" text-anchor="middle" class="small">sessões afetadas caem</text>
  <rect x="675" y="435" width="230" height="58" rx="12" class="deny"/>
  <text x="790" y="459" text-anchor="middle" class="title">Sem match</text>
  <text x="790" y="479" text-anchor="middle" class="small">deny implícito no fim</text>
  <path d="M490 400V435" class="flow"/>
</svg>
